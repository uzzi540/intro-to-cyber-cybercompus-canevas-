<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login - CyberCampus</title><link rel="stylesheet" href="/css/style.css"></head>
<body><header></header><main>
<div class="banner">Fictional lab portal - do not enter real credentials.</div>
<h2>Login</h2>
<form id="f"><label for="u">Username</label><input id="u" autocomplete="off" placeholder="student1">
<label for="p">Password</label><input id="p" type="password" placeholder="Demo#2026">
<button type="submit">Sign in</button><div class="msg" id="m"></div>
<p class="muted">Demo accounts (fictional): student1 / teacher1 - password Demo#2026</p></form>
</main><footer></footer>
<script src="/js/app.js"></script>
<script>renderLayout("login.html");

document.getElementById("f").onsubmit=async e=>{e.preventDefault();const m=document.getElementById("m");
const r=await api("/api/login",{method:"POST",body:JSON.stringify({username:u.value,password:p.value})});
if(r.ok){sessionStorage.setItem("cc_token",r.data.token);m.className="msg ok";m.textContent="Login successful...";location.href="/profile.html";}
else{m.className="msg err";m.textContent="Invalid credentials (HTTP "+r.status+").";}};
</script></body></html>
