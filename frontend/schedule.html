<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Schedule - CyberCampus</title><link rel="stylesheet" href="/css/style.css"></head>
<body><header></header><main>
<div class="banner">Fictional lab portal - do not enter real credentials.</div>
<h2>Weekly schedule</h2><table><thead><tr><th>Day</th><th>Time</th><th>Course</th><th>Room</th></tr></thead><tbody id="rows"></tbody></table>
</main><footer></footer>
<script src="/js/app.js"></script>
<script>renderLayout("schedule.html");

if(requireLogin()){(async()=>{const r=await api("/api/schedule");
if(r.ok)document.getElementById("rows").innerHTML=r.data.map(s=>`<tr><td>${s.day}</td><td>${s.start} - ${s.end}</td><td>${s.course_code}</td><td>${s.room}</td></tr>`).join("");
else{sessionStorage.clear();location.href="/login.html";}})();}
</script></body></html>
